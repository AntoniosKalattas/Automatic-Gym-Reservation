name: Build & Release Android App

on:
  push:
    tags:
      - 'v*' # Trigger build and release on version tags like v1.0.2
  workflow_dispatch: # Allow manual triggering from the Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd mobile
          npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: Build Standalone Android APK
        run: |
          cd mobile/android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-reservation-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          body: |
            Gym Reservation standalone Android APK release.
            
            Download the attached `app-release.apk` to install on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
